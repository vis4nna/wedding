<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Invitation</title>

    <!-- Google Fonts: Great Vibes, Cormorant Garamond, Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@200;300;400&display=swap" rel="stylesheet">

    <style>
        :root {
            --text-color: #ffffff;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-glow: rgba(212, 175, 55, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            background-color: #000000; /* Dark base prevents flash during transitions */
        }

        body {
            background-image: url('img/download (6).png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: var(--text-color);
            font-family: 'Cormorant Garamond', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            /* Full page opacity setup */
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        /* Active page fade states */
        body.fade-in {
            opacity: 1 !important;
        }

        body.fade-out {
            opacity: 0 !important;
        }

        /* Glass Card Container */
        .invite {
            text-align: center;
            max-width: 650px;
            width: 100%;
            padding: 50px 30px;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 4px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .pre-header {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--gold-light);
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin: 0 auto 30px auto;
            max-width: 200px;
        }

        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            width: 100%;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .divider span {
            color: var(--gold);
            font-size: 1rem;
        }

        .invite p.main-text {
            font-family: 'Great Vibes', cursive;
            font-size: 3.2rem;
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 40px;
            background: linear-gradient(135deg, #ffffff 0%, #fef3c7 50%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 8px rgba(0, 0, 0, 0.9));
        }

        .button-group {
            display: flex;
            gap: 25px;
            justify-content: center;
            align-items: center;
        }

        .button-group a {
            text-decoration: none;
        }

        .invite button {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 14px 38px;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.4s ease;
            background: transparent;
            outline: none;
        }

        .btn-accept {
            color: #ffffff;
            border: 1px solid var(--gold);
            background: rgba(0, 0, 0, 0.3);
        }

        .btn-accept:hover {
            background-color: var(--gold);
            color: #1a1a1a;
            box-shadow: 0 0 25px var(--gold-glow);
            transform: translateY(-2px);
        }

        .btn-decline {
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(0, 0, 0, 0.2);
        }

        .btn-decline:hover {
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        @media (max-width: 500px) {
            .invite {
                padding: 35px 20px;
            }
            .invite p.main-text {
                font-size: 2.3rem;
                margin-bottom: 30px;
            }
            .button-group {
                flex-direction: column;
                gap: 15px;
            }
            .invite button {
                width: 100%;
                max-width: 240px;
            }
        }
    </style>
</head>
<body>

    <div class="invite">
        <div class="pre-header">You Are Cordially Invited</div>
        <div class="divider">
            <span>✦</span>
        </div>
        
        <p class="main-text">We would like to invite you to join our wedding celebration.</p>
        
        <div class="button-group">
            <a href="home.html" id="accept-link">
                <button class="btn-accept">Accept</button>
            </a>
            <button class="btn-decline">Decline</button>
        </div>
    </div>

    <script>
        function triggerFadeIn() {
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    document.body.classList.add('fade-in');
                });
            });
        }

        // Trigger initial page load fade-in
        if (document.readyState === 'interactive' || document.readyState === 'complete') {
            triggerFadeIn();
        } else {
            window.addEventListener('DOMContentLoaded', triggerFadeIn);
        }

        // Handle page restores / back button
        window.addEventListener('pageshow', (e) => {
            if (e.persisted) {
                document.body.classList.remove('fade-out');
                document.body.classList.add('fade-in');
            }
        });

        // Fade out on Accept click
        document.getElementById('accept-link').addEventListener('click', function(e) {
            e.preventDefault();
            const targetUrl = this.getAttribute('href');

            document.body.classList.remove('fade-in');
            document.body.classList.add('fade-out');

            setTimeout(() => {
                window.location.href = targetUrl;
            }, 800);
        });
    </script>

</body>
</html>
