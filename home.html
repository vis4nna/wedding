<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>សិរីមង្គលអាពាហ៍ពិពាហ៍ - Pete & Moo</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&family=Kantumruy+Pro:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-burgundy: #5d1624; /* Deep Burgundy */
            --cream-text: #f9f4ec;  /* Soft Warm Cream */
            --accent-gold: #e2c088; /* Gold Accent */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            background-color: #000000; /* Dark base prevents flash during transitions */
        }

        body {
            /* Replace with your background image path */
            background-image: url('img/download\ \(1\).png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Kantumruy Pro', sans-serif;
            color: var(--cream-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            /* Page fade-in transition setup */
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        /* Class added by JS on load */
        body.fade-in {
            opacity: 1;
        }

        .invitation-card {
            width: 100%;
            max-width: 900px;
            background-color: var(--cream-text);
            border: 2px solid rgba(226, 192, 136, 0.5);
            border-radius: 8px;
            padding: 60px 40px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 40px;
            align-items: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        /* Left Side: Names & Details */
        .left-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .wedding-title {
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            font-family: 'Cinzel', serif;
            color: var(--bg-burgundy);
        }

        .couple-names {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            font-weight: 600;
            line-height: 1.1;
            margin-bottom: 10px;
            color: var(--bg-burgundy);
        }

        .couple-names .ampersand {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            display: inline-block;
            margin: 0 10px;
            color: var(--bg-burgundy);
            font-weight: 400;
        }

        .invite {
            font-size: 1.2rem;
            margin-bottom: 30px;
            letter-spacing: 1px;
            color: var(--bg-burgundy);
            opacity: 0.9;
        }

        .event-info-row {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            border-top: 1px solid rgba(93, 22, 36, 0.2);
            padding-top: 20px;
        }

        .date-block, .location-block {
            font-size: 0.95rem;
            line-height: 1.5;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--bg-burgundy);
        }

        .date-block strong, .location-block strong {
            color: var(--bg-burgundy);
            font-weight: 600;
        }

        .divider-line {
            width: 1px;
            height: 40px;
            background-color: var(--bg-burgundy);
            opacity: 0.4;
        }

        /* Right Side Art */
        .right-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-left: 1px solid rgba(93, 22, 36, 0.15);
            padding-left: 40px;
            height: 100%;
            position: relative;
        }

        .right-content img {
            width: 100%;
            max-width: 280px;
            filter: drop-shadow(0px 4px 8px rgba(0, 0, 0, 0.15));
        }

        .rsvp-btn {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: var(--bg-burgundy);
            text-decoration: none;
            text-transform: uppercase;
            position: absolute;
            bottom: 20px;
            right: 40px;
            transition: opacity 0.3s ease;
        }

        .rsvp-btn:hover {
            opacity: 0.7;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .invitation-card {
                grid-template-columns: 1fr;
                padding: 40px 20px;
                text-align: center;
            }
            .couple-names {
                font-size: 2.8rem;
            }
            .event-info-row {
                justify-content: center;
            }
            .right-content {
                border-left: none;
                border-top: 1px solid rgba(93, 22, 36, 0.15);
                padding-left: 0;
                padding-top: 30px;
            }
            .rsvp-btn {
                position: relative;
                bottom: auto;
                right: auto;
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <!-- Left Side Details -->
        <div class="left-content">
            <div class="wedding-title">Wedding Invitation</div>
            <h1 class="couple-names">
                Pete <span class="ampersand">&</span> Moo
            </h1>
            <div class="invite">You have been invited to our wedding</div>

            <div class="event-info-row">
                <div class="date-block">
                    <strong>11 DECEMBER 2026</strong><br>
                    <span>5:00 PM</span>
                </div>
                <div class="divider-line"></div>
                <div class="location-block">
                    <strong>THE GRAND TERRACE</strong><br>
                    <span>(Building A & B)</span>
                </div>
            </div>
        </div>

        <!-- Right Side Art -->
        <div class="right-content">
            <img src="img/Screenshot 2026-10-17 155544-Photoroom.png" alt="Wedding Illustration">
        </div>
    </div>

    <!-- Script to trigger fade-in on load -->
   <script>
    function triggerFadeIn() {
        // Force the browser to render the initial state (opacity: 0) first
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                document.body.classList.add('fade-in');
            });
        });
    }

    // Run immediately if DOM is already parsed
    if (document.readyState === 'interactive' || document.readyState === 'complete') {
        triggerFadeIn();
    } else {
        window.addEventListener('DOMContentLoaded', triggerFadeIn);
    }

    // Handle back-button / cached loads
    window.addEventListener('pageshow', (event) => {
        if (event.persisted) {
            document.body.classList.add('fade-in');
        }
    });
</script>
</body>
</html>
